[project]
name = "valorant-skin-classifier"
version = "0.1.0"
description = "Valorant gun skin image classifier using PyTorch and torchvision"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pyright[nodejs]>=1.1.0",
]

[tool.ruff.lint]
extend-select = [
    "UP",
    "I",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.0",
]
